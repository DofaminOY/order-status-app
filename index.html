<!DOCTYPE html> 
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./style.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0"
    />
  </head>
  <body>
    <form id="customForm" action="">
      <h2>Создание заказа</h2>
      <input type="text" placeholder="Адрес" /><input
        type="text"
        placeholder="Цена"
      /><input type="text" placeholder="Получатель" />
      <button type="submit">Создать</button>
    </form>
    <div class="buttons buttons--hidden" id="buttons">
      <button id="buttonPaid">Заказ оплачен</button>
      <button id="buttonSent">Заказ отправлен</button>
      <button id="buttonGet">Заказ получен</button>
    </div>
    <div
      class="notification-container notification-container__hidden"
      id="notificationContainer"
    ></div>
    <script src="./index.js"></script>
  </body>
</html>
